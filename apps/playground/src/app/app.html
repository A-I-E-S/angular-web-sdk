<aies-app-shell
  contentWidth="5xl"
  [headerTitle]="pageTitle()"
  [breadcrumbs]="crumbs()"
  [catalogNav]="navItems"
>
  <div aiesAppShellHeader>
    <aies-app-shell-header
      [userName]="displayName()"
      [greetingName]="greetingName()"
      [userMenuItems]="accountMenu"
      [notifications]="notifications()"
      [onNotificationMarkRead]="markNotificationRead"
      [onNotificationMarkAllRead]="markAllNotificationsRead"
      [onNotificationLoadPage]="loadNotificationPage"
    >
      <div aiesAppShellHeaderEnd class="flex flex-wrap items-center justify-end gap-2">
        <app-playground-access-token />

        <div
          class="inline-flex rounded-lg border border-border p-0.5 dark:border-white/15"
          role="group"
          aria-label="Import or export mode"
        >
          <button
            aies-button
            type="button"
            size="sm"
            [variant]="shippingMode() === 'stn' ? 'primary' : 'ghost'"
            (click)="setShippingMode('stn')"
          >
            Import
          </button>
          <button
            aies-button
            type="button"
            size="sm"
            [variant]="shippingMode() === 'sfn' ? 'primary' : 'ghost'"
            (click)="setShippingMode('sfn')"
          >
            Export
          </button>
        </div>

        <button
          aies-button
          type="button"
          variant="secondary"
          size="sm"
          (click)="toggleTheme()"
          [attr.aria-label]="
            'Switch to ' + (themeMode() === 'light' ? 'dark' : 'light') + ' theme'
          "
        >
          <aies-icon [name]="themeMode() === 'light' ? 'adjust' : 'alarm'" [size]="14" />
          {{ themeMode() === 'light' ? 'Dark' : 'Light' }}
        </button>
      </div>
    </aies-app-shell-header>
  </div>

  <aies-side-nav
    sidenav
    ariaLabel="Catalog"
    [items]="navItems"
    [(collapsed)]="navCollapsed"
    [linkActiveOptions]="linkActiveOptions"
  />

  <router-outlet />
</aies-app-shell>
